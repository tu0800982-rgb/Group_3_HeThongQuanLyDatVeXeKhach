<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng ký | VeXePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth-shell"><a class="brand" href="index.html"><i class="fa-solid fa-bus-simple"></i>VeXe<span
                class="brand-accent">Pro</span></a>
        <section class="auth-card form-card">
            <p class="eyebrow">TÀI KHOẢN MỚI</p>
            <h1>Đăng ký</h1>
            <p>Chỉ cần họ tên và số điện thoại để tạo tài khoản.</p>
            <form id="registerForm" novalidate><label>Họ và tên<input name="fullName" autocomplete="name" required
                        placeholder="Nguyễn Văn A"></label><label>Số điện thoại<input name="phone" inputmode="numeric"
                        pattern="[0-9]{10}" autocomplete="tel" required placeholder="0987654321"></label><button
                    class="button button-primary button-block" type="submit">Tạo tài khoản</button></form>
            <p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
        </section>
    </main>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
