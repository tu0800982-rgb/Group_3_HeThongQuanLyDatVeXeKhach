<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng nhập | VeXePro</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth-shell"><a class="brand" href="index.html"><i class="fa-solid fa-bus-simple"></i>VeXe<span
                class="brand-accent">Pro</span></a>
        <section class="auth-card form-card">
            <p class="eyebrow">CHÀO MỪNG TRỞ LẠI</p>
            <h1>Đăng nhập</h1>
            <p>Nhập số điện thoại đã đăng ký để tiếp tục.</p>
            <form id="loginForm" novalidate><label>Số điện thoại<input name="phone" inputmode="numeric"
                        pattern="[0-9]{10}" autocomplete="tel" required placeholder="0987654321"></label><button
                    class="button button-primary button-block" type="submit">Đăng nhập</button></form>
            <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
            <p class="auth-note">Tài khoản admin mẫu: admin · 0987654321</p>
        </section>
    </main>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
