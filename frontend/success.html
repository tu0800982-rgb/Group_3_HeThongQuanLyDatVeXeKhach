<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đặt vé thành công | RouteLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/payment.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="navbar"></div>
    <main class="page-shell success-shell">
        <section id="ticket" class="ticket-card">
            <div class="success-icon"><i class="fa-solid fa-check"></i></div>
            <p class="eyebrow">THANH TOÁN THÀNH CÔNG</p>
            <h1>Chuyến đi của bạn đã sẵn sàng!</h1>
            <p class="muted">Vé điện tử đã được xác nhận. Hãy lưu lại mã vé để tiện tra cứu.</p>
            <div id="ticketDetails" class="ticket-details"></div>
            <div class="mock-qr" aria-label="Mã QR vé điện tử"><span>ROUTE<br>LINK</span></div>
            <div class="ticket-actions"><button id="printTicket" class="button button-secondary"><i
                        class="fa-solid fa-print"></i> In vé</button><button id="downloadTicket"
                    class="button button-secondary"><i class="fa-solid fa-download"></i> Tải vé</button><a
                    href="index.html" class="button button-primary">Về trang chủ</a></div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="js/common.js"></script>
    <script src="js/payment.js"></script>
</body>

</html>
