<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Thông tin đặt vé | RouteLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/booking.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="navbar"></div>
    <main class="page-shell">
        <div class="page-title">
            <p class="eyebrow">XÁC NHẬN THÔNG TIN</p>
            <h1>Hoàn tất thông tin hành khách</h1>
        </div>
        <section class="checkout-layout">
            <form id="bookingForm" class="form-card">
                <h2>Thông tin liên hệ</h2><label>Họ và tên<input id="customerName" required minlength="2"
                        maxlength="100" placeholder="Nguyễn Văn A"><small></small></label><label>Số điện thoại<input
                        id="phone" required inputmode="numeric" pattern="[0-9]{10}"
                        placeholder="09xxxxxxxx"><small></small></label><label>Email<input id="email" required
                        type="email" placeholder="ban@example.com"><small></small></label><label>Hạng khách hàng<select
                        id="customerType" required>
                        <option value="NORMAL">Khách thường — không giảm giá</option>
                        <option value="MEMBER">Thành viên — giảm 10%</option>
                        <option value="VIP">VIP — giảm 20%</option>
                    </select></label><button class="button button-primary button-block" type="submit">Tạo đơn đặt vé <i
                        class="fa-solid fa-arrow-right"></i></button>
            </form>
            <aside id="bookingSummary" class="order-card"></aside>
        </section>
    </main>
    <div id="footer"></div>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/booking.js"></script>
</body>

</html>
