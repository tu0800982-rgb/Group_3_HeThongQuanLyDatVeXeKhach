<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chuyến xe | RouteLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/trip.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="navbar"></div>
    <main class="page-shell">
        <div class="page-title">
            <p class="eyebrow">TÌM CHUYẾN XE</p>
            <h1>Chọn hành trình phù hợp</h1>
            <p>So sánh giờ chạy, loại xe và chỗ trống trước khi đặt.</p>
        </div>
        <form id="tripFilterForm" class="filter-panel"><label>Điểm đi<select id="departure">
                    <option value="">Tất cả</option>
                    <option value="Ha Noi">Hà Nội</option>
                    <option value="Hai Phong">Hải Phòng</option>
                </select></label><label>Điểm đến<select id="destination">
                    <option value="">Tất cả</option>
                    <option value="Ha Noi">Hà Nội</option>
                    <option value="Hai Phong">Hải Phòng</option>
                </select></label><label>Ngày đi<input id="departureDate" type="date"></label><label>Loại ghế<select
                    id="seatType">
                    <option value="">Tất cả</option>
                    <option value="NORMAL">Thường</option>
                    <option value="VIP">VIP</option>
                </select></label><label>Giá tối thiểu<input id="minimumPrice" type="number" min="0"
                    placeholder="150000"></label><label>Giá tối đa<input id="maximumPrice" type="number" min="0"
                    placeholder="200000"></label><label>Loại xe<input id="busType" type="text"
                    placeholder="Ví dụ: Limousine"></label><button class="button button-primary" id="filterButton" type="submit"><i
                    class="fa-solid fa-filter"></i> Lọc chuyến</button></form>
        <section id="tripList" class="trip-list" aria-live="polite"></section>
    </main>
    <div id="footer"></div>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/trip.js"></script>
</body>

</html>
